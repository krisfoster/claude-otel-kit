# Fast checks only: shellcheck and the three suites that need no sbx, no sandboxes and no API key.
# tests/e2e.sh needs a real sbx and Claude, so it is run by hand (see README).
#
# Kept cheap on purpose: one Ubuntu job, nothing to install or cache, runs only when code or tests
# change, cancels a run that a newer push has made pointless, and is capped at 3 minutes.
name: ci

on:
  push:
    branches: [main]
    paths:
      - "bin/**"
      - "kit/**"
      - "install.sh"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "bin/**"
      - "kit/**"
      - "install.sh"
      - "tests/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -S warning bin/claude-otel install.sh tests/*.sh
      - name: installer, kit arguments and wrapper
        run: |
          tests/install.sh
          tests/kit.sh
          tests/wrapper.sh
