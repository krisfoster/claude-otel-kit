# syntax=docker/sandbox-kit:3
#
# Claude Code OpenTelemetry: exports traces, metrics and logs from a sandboxed
# Claude to otel-desktop-viewer running on the host, tagged with the sandbox
# name (sandbox.name) and id (sandbox.id).
#
# Use:  sbx create claude --kit ./kit --name my-sbx .
schemaVersion: "3"
kind: mixin
displayName: Claude Code OpenTelemetry
description: >-
    Sends Claude Code traces, metrics and logs to otel-desktop-viewer on the host, with the
    sandbox name and id on every signal.
licenses: [Apache-2.0]
version: "0.1.0"
args:
    viewerPort:
        default: "4318"
        pattern: '^(10(2[5-9]|[3-9][0-9])|1[1-9][0-9]{2}|[2-9][0-9]{3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$'
        description: >-
            OTLP/HTTP port of otel-desktop-viewer on the host, 1025 to 65535. The sandbox is
            allowed to reach this port on your machine, so give it only the viewer's port.
    capture:
        default: none
        enum: [none, tools, full]
        description: >-
            What content goes into telemetry. none (the default) = metadata only, with no command
            text or file paths; tools = also the full text of Bash commands and file paths, which
            can include secrets; full = also prompts, responses and tool output.
    metricIntervalMs:
        default: "10000"
        pattern: '^[0-9]{3,6}$'
        description: Metrics export interval in milliseconds (Claude's own default is 60000)
    extraResourceAttributes:
        default: ""
        pattern: '^([A-Za-z0-9_.-]+=[A-Za-z0-9_.%-]+(,[A-Za-z0-9_.-]+=[A-Za-z0-9_.%-]+)*)?$'
        description: Extra resource attributes as key=value,key=value (no spaces; percent-encode specials)
    accountIds:
        default: "false"
        enum: ["true", "false"]
        description: >-
            Include user.account_uuid and user.account_id in telemetry. Claude Code includes them
            by default; this kit turns them off. user.email, user.id and organization.id are
            always sent by Claude Code and cannot be turned off here.
capabilities:
    - type: com.docker.sandbox/network-policy@1
      config:
          runtime:
              allow:
                  - "localhost:${{ kit.args.viewerPort }}"
    - type: com.docker.sandbox/lifecycle@1
      config:
          files:
              - path: /home/agent/.local/share/claude-otel-kit/env.sh
                mode: "0644"
                description: Telemetry environment, sourced by bash at agent launch
                content: |
                    # Written by the claude-otel kit. $SANDBOX_NAME and $SANDBOX_ID are evaluated
                    # when the shell starts, so they follow the sandbox, not create time.
                    export CLAUDE_CODE_ENABLE_TELEMETRY=1
                    export CLAUDE_CODE_ENHANCED_TELEMETRY_BETA=1
                    export OTEL_TRACES_EXPORTER=otlp
                    export OTEL_METRICS_EXPORTER=otlp
                    export OTEL_LOGS_EXPORTER=otlp
                    export OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
                    export OTEL_EXPORTER_OTLP_ENDPOINT="http://host.docker.internal:${{ kit.args.viewerPort }}"
                    export OTEL_METRIC_EXPORT_INTERVAL="${{ kit.args.metricIntervalMs }}"
                    export OTEL_LOGS_EXPORT_INTERVAL=2000
                    export OTEL_TRACES_EXPORT_INTERVAL=2000
                    export OTEL_METRICS_INCLUDE_ACCOUNT_UUID="${{ kit.args.accountIds }}"
                    case "${{ kit.args.capture }}" in
                      tools)
                        export OTEL_LOG_TOOL_DETAILS=1 ;;
                      full)
                        export OTEL_LOG_TOOL_DETAILS=1
                        export OTEL_LOG_USER_PROMPTS=1
                        export OTEL_LOG_ASSISTANT_RESPONSES=1
                        export OTEL_LOG_TOOL_CONTENT=1 ;;
                    esac
                    _claude_otel_attrs="sandbox.name=${SANDBOX_NAME:-unknown},sandbox.id=${SANDBOX_ID:-unknown}"
                    if [ -n "${{ kit.args.extraResourceAttributes }}" ]; then
                      _claude_otel_attrs="${_claude_otel_attrs},${{ kit.args.extraResourceAttributes }}"
                    fi
                    export OTEL_RESOURCE_ATTRIBUTES="${_claude_otel_attrs}"
                    unset _claude_otel_attrs
          startup:
              - command:
                    - sh
                    - -c
                    - |
                      line='. /home/agent/.local/share/claude-otel-kit/env.sh # claude-otel-kit'
                      for f in /etc/sandbox-persistent.sh /home/agent/.bashrc; do
                        touch "$f" 2>/dev/null || continue
                        grep -qF 'claude-otel-kit' "$f" || printf '%s\n' "$line" >> "$f"
                      done
                description: Source the telemetry env from BASH_ENV and ~/.bashrc (idempotent)
              - command:
                    - sh
                    - -c
                    - |
                      d=/home/agent/.local/share/claude-otel-kit
                      if curl -sf -m 3 -o /dev/null -X POST -H 'content-type: application/x-protobuf' --data-binary '' "http://host.docker.internal:${{ kit.args.viewerPort }}/v1/traces"; then
                        echo "viewer reachable at $(date -u +%FT%TZ)" > "$d/status"
                      else
                        echo "WARNING: otel-desktop-viewer not reachable on host port ${{ kit.args.viewerPort }} at $(date -u +%FT%TZ); telemetry will be dropped until it is running" > "$d/status"
                      fi
                background: true
                description: Probe the host viewer and record the result in a status file
